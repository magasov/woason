name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.woason.ru
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            BRANCH="${{ github.ref_name }}"
            mkdir -p /opt/woason/web
            if [ ! -d /opt/woason/web/.git ]; then
              git clone https://github.com/magasov/woason.git /opt/woason/web
            fi
            cd /opt/woason/web
            git fetch origin
            git reset --hard "origin/$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git clean -fd -e .env -e .env.local
            test -f .env || { echo "missing /opt/woason/web/.env"; exit 1; }
            chmod 600 .env
            docker compose up -d --build
            docker compose ps
